name: Build Custom QcClip x64

on:
  workflow_dispatch:
  push:
    branches:
      - custom-kaomoji
      - custom-kaomoji-beta7

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_RELEASE_LTO: fat
  CARGO_PROFILE_RELEASE_OPT_LEVEL: '3'
  CARGO_PROFILE_RELEASE_PANIC: abort
  CARGO_PROFILE_RELEASE_STRIP: symbols
  CARGO_PROFILE_RELEASE_DEBUG: 'false'
  CARGO_PROFILE_RELEASE_INCREMENTAL: 'false'
  CARGO_PROFILE_RELEASE_OVERFLOW_CHECKS: 'false'
  CMAKE_GENERATOR: Ninja

defaults:
  run:
    shell: pwsh

jobs:
  build:
    name: Build Windows x64
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      BUILD_ARCH: x64
      BUILD_TARGET: x86_64-pc-windows-msvc
      BUILD_EXECUTABLE: target/release/QcClip.exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        run: |
          rustup show active-toolchain
          rustup target add $env:BUILD_TARGET

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: windows-x64-custom

      - name: Install cargo-packager
        run: |
          cargo install cargo-packager --version 0.11.8 --locked

      - name: Build and Package
        env:
          QCCLIP_RELEASE_GUI: '1'
        run: ./scripts/package.ps1 -Arch $env:BUILD_ARCH -PackageType both

      - name: Verify subsystem
        run: |
          $stream = [System.IO.File]::OpenRead($env:BUILD_EXECUTABLE)
          try {
            $reader = [System.IO.BinaryReader]::new($stream)
            $stream.Position = 0x3c
            $peOffset = $reader.ReadInt32()
            $stream.Position = $peOffset
            if ($reader.ReadUInt32() -ne 0x4550) { throw 'Invalid PE file' }
            $stream.Position = $peOffset + 24 + 68
            $subsystem = $reader.ReadUInt16()
            if ($subsystem -ne 2) {
              throw "Expected Windows GUI subsystem (2), but got $subsystem"
            }
          } finally {
            $stream.Dispose()
          }

      - name: Upload Binary
        uses: actions/upload-artifact@v4
        with:
          name: QcClip-custom-x64
          path: |
            target/release/QcClip.exe
            target/packager/*.zip
          if-no-files-found: error
